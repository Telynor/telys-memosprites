name: Build Memosprites Release
on:
  push:
    branches: [main, 'codex/audit-*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax and live summon lifecycle
        run: |
          node --check scripts/memosprites.js
          npm test
      - name: Check out the released Skill spell coordinator
        uses: actions/checkout@v4
        with:
          repository: Telynor/telys-star-rail-ultimates-v2
          ref: fc2b9bb3532461e2c51177d5b2e8f030d5da0ad7
          path: .test-ultimates
          persist-credentials: false
      - name: Check the live summon HUD in Chromium
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright
          npx playwright install --with-deps chromium --only-shell
          ULTIMATES_SOURCE_ROOT=.test-ultimates node tests/summon-hud-ui.cjs
      - name: Upload summon HUD screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summon-hud-screenshots
          path: summon-hud-*.png
          if-no-files-found: ignore
      - name: Package module
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('module.json')).version")"
          echo "MEMOSPRITE_VERSION=$version" >> "$GITHUB_ENV"
          zip -r "telys-memosprites-v$version.zip" module.json README.md memosprites.js memosprites.css scripts styles
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$MEMOSPRITE_VERSION"
          archive="telys-memosprites-v$MEMOSPRITE_VERSION.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" module.json --clobber
          else
            gh release create "$tag" "$archive" module.json --title "$tag" --generate-notes --target "$GITHUB_SHA"
          fi
